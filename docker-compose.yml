services:
  pandas-client:
    environment:
      - DATASET=${DATASET}
      - N_REPETITIONS=${N_REPETITIONS}
    build:
      context: .
      dockerfile: ./sut/pandas/Dockerfile
    volumes:
      - ./results/pandas:/app/results/pandas
      - ./data:/app/data
      - ./sut/pandas/:/app/
      - ./sut/utils.py:/app/utils.py
  duckdbparse-client:
    environment:
      - DATASET=${DATASET}
      - N_REPETITIONS=${N_REPETITIONS}
    build:
      context: .
      dockerfile: ./sut/duckdbparse/Dockerfile
    volumes:
      - ./results/duckdbparse:/app/results/duckdbparse
      - ./data:/app/data
      - ./sut/duckdbparse/:/app/
      - ./sut/utils.py:/app/utils.py
  duckdbauto-client:
    environment:
      - DATASET=${DATASET}
      - N_REPETITIONS=${N_REPETITIONS}
    build:
      context: .
      dockerfile: ./sut/duckdbauto/Dockerfile
    volumes:
      - ./results/duckdbauto:/app/results/duckdbauto
      - ./data:/app/data
      - ./sut/duckdbauto/:/app/
      - ./sut/utils.py:/app/utils.py
  pycsv-client:
    environment:
      - DATASET=${DATASET}
      - N_REPETITIONS=${N_REPETITIONS}
    build:
      context: .
      dockerfile: ./sut/pycsv/Dockerfile
    volumes:
      - ./results/pycsv:/app/results/pycsv
      - ./data:/app/data
      - ./sut/pycsv/:/app/
      - ./sut/utils.py:/app/utils.py
  clevercs-client:
    environment:
      - DATASET=${DATASET}
      - N_REPETITIONS=${N_REPETITIONS}
    build:
      context: .
      dockerfile: ./sut/clevercs/Dockerfile
    volumes:
      - ./results/clevercs:/app/results/clevercs
      - ./data:/app/data
      - ./sut/clevercs/:/app/
      - ./sut/utils.py:/app/utils.py
  code-generation-llm-client:
    environment:
      - DATASET=${DATASET}
      - N_REPETITIONS=${N_REPETITIONS}
      - LLM_BACKEND=${LLM_BACKEND:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-}
      - OPENAI_ENDPOINT=${OPENAI_ENDPOINT:-}
    build:
      context: .
      dockerfile: ./sut/code_generation_llm/Dockerfile
    volumes:
      - ./results/code_generation_llm:/results/code_generation_llm
      - ./data:/data
      - ./sut/code_generation_llm/:/app/
      - ./sut/utils.py:/app/utils.py
  full-llm-loader-client:
    environment:
      - DATASET=${DATASET}
      - N_REPETITIONS=${N_REPETITIONS}
      - LLM_BACKEND=${LLM_BACKEND:-}
      - FULL_LLM_LOADER_BACKEND=${FULL_LLM_LOADER_BACKEND:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-}
      - OPENAI_API_BASE=${OPENAI_API_BASE:-}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-}
      - OLLAMA_API_BASE=${OLLAMA_API_BASE:-}
    build:
      context: .
      dockerfile: ./sut/full_llm_loader/Dockerfile
    volumes:
      - ./results/full_llm_loader_naive:/results/full_llm_loader_naive
      - ./data:/data
      - ./sut/full_llm_loader/:/app/
      - ./sut/utils.py:/app/utils.py
  llm-hybrid-parser-client:
    environment:
      - DATASET=${DATASET}
      - N_REPETITIONS=${N_REPETITIONS}
      - LLM_BACKEND=${LLM_BACKEND:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-}
      - OPENAI_ENDPOINT=${OPENAI_ENDPOINT:-}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-}
      - OLLAMA_API_BASE=${OLLAMA_API_BASE:-}
    build:
      context: .
      dockerfile: ./sut/llm_hybrid_parser/Dockerfile
    volumes:
      - ./results/llm_hybrid_parser:/results/llm_hybrid_parser
      - ./results/_llm_cache:/results/_llm_cache
      - ./data:/data
      - ./sut/llm_hybrid_parser/:/app/
      - ./sut/utils.py:/app/utils.py
  llm-code-generator-client:
    environment:
      - DATASET=${DATASET}
      - N_REPETITIONS=${N_REPETITIONS}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-}
      - OPENAI_ENDPOINT=${OPENAI_ENDPOINT:-}
    build:
      context: .
      dockerfile: ./sut/llm_code_generator/Dockerfile
    volumes:
      - ./results/custom:/results/custom
      - ./data:/data
      - ./sut/llm_code_generator/:/app/
      - ./sut/utils.py:/app/utils.py
  pollution:
    image: pollution
    command: ["python3", "/app/pollute_main.py"]
    build:
      context: .
      dockerfile: Dockerfile-pollution
    volumes:
      - ./data:/app/data
      - ./results/source.csv:/app/results/source.csv
  evaluate:
    image: evaluate
    build:
      context: .
      dockerfile: Dockerfile-pollution
    environment:
      - DATASET=${DATASET}
    command: ["python3", "/app/evaluate.py"]
    volumes:
      - ./results:/app/results
      - ./data:/app/data
      - ./evaluate.py:/app/evaluate.py
      - ./sut/utils.py:/app/utils.py

